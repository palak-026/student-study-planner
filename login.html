<!DOCTYPE html>
<html>

<head>

    <title>Login - Student Study Planner</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f6fb;

            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;
        }


        /* LOGIN CONTAINER */

        .login-container {
            width: 400px;
            max-width: 90%;

            background: white;

            padding: 40px;

            border-radius: 20px;

            box-shadow: 0 10px 30px rgba(0,0,0,0.10);

            text-align: center;
        }


        /* LOGO */

        .logo {
            font-size: 40px;

            margin-bottom: 10px;
        }


        .title {
            color: #4f46e5;

            font-size: 26px;

            margin-bottom: 8px;
        }


        .subtitle {
            color: #777;

            font-size: 14px;

            margin-bottom: 30px;
        }


        /* FORM */

        .form-group {
            text-align: left;

            margin-bottom: 18px;
        }


        .form-group label {
            display: block;

            font-size: 14px;

            font-weight: bold;

            margin-bottom: 7px;
        }


        .form-group input {
            width: 100%;

            padding: 13px;

            border: 1px solid #ddd;

            border-radius: 9px;

            font-size: 14px;

            outline: none;
        }


        .form-group input:focus {
            border-color: #4f46e5;
        }


        /* PASSWORD */

        .password-box {
            position: relative;
        }


        .password-box input {
            padding-right: 45px;
        }


        .show-password {
            position: absolute;

            right: 12px;

            top: 12px;

            cursor: pointer;

            font-size: 16px;
        }


        /* LOGIN BUTTON */

        .login-btn {
            width: 100%;

            padding: 13px;

            border: none;

            border-radius: 10px;

            background: #4f46e5;

            color: white;

            font-size: 15px;

            cursor: pointer;

            margin-top: 10px;
        }


        .login-btn:hover {
            background: #3730a3;
        }


        /* SIGN UP */

        .signup-text {
            margin-top: 22px;

            font-size: 14px;

            color: #777;
        }


        .signup-text a {
            color: #4f46e5;

            font-weight: bold;

            text-decoration: none;
        }


        /* MESSAGE */

        #message {
            margin-top: 15px;

            font-size: 14px;

            font-weight: bold;
        }

    </style>

</head>


<body>


    <div class="login-container">


        <div class="logo">
            🎓
        </div>


        <h1 class="title">
            Study Planner
        </h1>


        <p class="subtitle">
            Login to manage your study schedule
        </p>


        <!-- LOGIN FORM -->

        <div class="form-group">

            <label>
                Email
            </label>

            <input
                type="email"
                id="email"
                placeholder="Enter your email"
            >

        </div>


        <div class="form-group">

            <label>
                Password
            </label>


            <div class="password-box">

                <input
                    type="password"
                    id="password"
                    placeholder="Enter your password"
                >


                <span
                    class="show-password"
                    onclick="togglePassword()"
                >
                    👁️
                </span>

            </div>

        </div>


        <button
            class="login-btn"
            onclick="login()"
        >
            Login
        </button>


        <p
            id="message">
        </p>


        <p class="signup-text">

            Don't have an account?

            <a href="#">
                Create Account
            </a>

        </p>


    </div>



    <script>


        // SHOW / HIDE PASSWORD

        function togglePassword() {

            let password =
                document.getElementById("password");


            if (password.type === "password") {

                password.type = "text";

            }

            else {

                password.type = "password";

            }

        }



        // LOGIN

        function login() {


            let email =
                document.getElementById("email").value.trim();


            let password =
                document.getElementById("password").value.trim();


            let message =
                document.getElementById("message");


            if (email === "" || password === "") {

                message.style.color = "red";

                message.textContent =
                    "Please enter email and password.";

                return;

            }


            // CHECK VALID GMAIL ADDRESS

            if (!email.endsWith("@gmail.com")) {

                message.style.color = "red";

                message.textContent =
                    "Please enter a valid Gmail address.";

                return;

            }


            /*
                Temporary login.

                Later we will connect this
                to PHP + MySQL.
            */


            message.style.color = "green";

            message.textContent =
                "Login successful! 🎉";


            localStorage.setItem("loggedIn", "true");


            setTimeout(function() {

                window.location.href = "index.html";

            }, 1000);

        }


    </script>


</body>

</html>
